<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Beacon · 执行进度</title>
  <script src="panel-theme.js"></script>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="execution-panel" aria-label="当前任务执行进度">
    <div class="overview-island">
      <header class="panel-heading">
        <div class="heading-top"><p class="eyebrow">BEACON · 执行进度</p><span id="plan-version" class="plan-version">Plan 待同步</span></div>
        <h1 id="task-title">当前任务</h1>
      </header>

    <section id="session-picker" class="session-picker" aria-label="选择任务" hidden>
      <label for="session-select">选择要查看的 Codex 任务</label>
      <div class="picker-controls">
        <select id="session-select" aria-label="本地 Codex 任务"></select>
        <button id="select-session" type="button">查看</button>
      </div>
      <p id="picker-note" class="secondary">正在读取任务列表…</p>
    </section>

    <section id="progress-section" class="progress-section" aria-label="总体进度" hidden>
      <div class="progress-heading">
        <div><p class="progress-label">总体进度</p><span id="progress-count">等待同步计划</span></div>
        <span id="progress-percent" class="progress-percent">—</span>
      </div>
      <div id="progress-track" class="progress-track" role="progressbar" aria-label="已完成的主要节点" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>
    </div>

    <div id="empty-state" class="empty-state">
      <span class="empty-marker" aria-hidden="true">·</span>
      <h2 id="empty-title">正在连接执行状态</h2>
      <p id="empty-description">面板就绪后会自动跟随当前任务。</p>
    </div>

    <section class="route-island" aria-label="执行路线">
      <div class="route-heading"><h2 class="island-title">执行路线</h2><span id="parallel-state" class="parallel-state" role="status" hidden></span></div>
      <ol id="route" class="route" aria-label="计划主要节点" hidden></ol>
    </section>
    <div class="records-island">
      <section id="plan-changes" class="plan-changes" aria-label="计划调整记录" hidden></section>
      <section id="plan-history" class="plan-history" aria-label="计划历史版本与归档节点" hidden></section>
    </div>

    <div id="connection-error" class="connection-error" role="alert" hidden>
      <p id="connection-error-text"></p>
      <button id="retry" type="button">重试</button>
    </div>

    <footer class="panel-footer">
      <span class="runtime-state"><span id="runtime-dot" class="runtime-dot" aria-hidden="true"></span><span id="runtime-label">连接中</span></span>
      <time id="last-updated">尚未同步</time>
    </footer>
    <p id="status-announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="mcp-app-bridge.js"></script>
  <script src="plan-model.js"></script>
  <script src="panel.js"></script>
</body>
</html>
